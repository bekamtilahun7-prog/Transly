<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/transly-mark.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Translate documents between Afaan Oromo, Amharic, and English. Review, issue, and verify documents through one simple platform." />
    <title>Transly - Document translation and verification</title>
    <script>
        // Apply the saved theme before first paint to avoid a light/dark flash.
        try {
            var t = localStorage.getItem('transly.theme');
            if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
            var a = JSON.parse(localStorage.getItem('transly.a11y.v1') || 'null');
            if (a && a.mode === 'accessible') {
                document.documentElement.classList.add('a11y-mode');
                if (a.largeText) document.documentElement.classList.add('a11y-large');
                if (a.highContrast) document.documentElement.classList.add('a11y-contrast');
            }
        } catch (e) { }
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
